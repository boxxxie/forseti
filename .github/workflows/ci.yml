name: CI

on:
  push:
    branches: [main, master, "track/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: forseti

      # Sibling paths (../xitdb/xitdb, ../hugi/hugi, ../hugi/deps/obench/obench)
      # match ols.json and benchmarks/.
      - name: Checkout odin-xitdb
        uses: actions/checkout@v7
        with:
          repository: boxxxie/odin-xitdb
          ref: v2.2.0
          path: xitdb
          submodules: false
          persist-credentials: false

      - name: Checkout hugi v0.2.0 (runner only)
        uses: actions/checkout@v7
        with:
          repository: boxxxie/hugi
          ref: v0.2.0
          path: hugi
          submodules: false
          persist-credentials: false

      - name: Checkout sleipnir v1.1.3
        uses: actions/checkout@v7
        with:
          repository: boxxxie/sleipnir
          ref: v1.1.3
          path: sleipnir
          submodules: false
          persist-credentials: false

      - name: Checkout runa
        uses: actions/checkout@v7
        with:
          repository: boxxxie/runa
          ref: main
          path: runa
          submodules: false
          persist-credentials: false

      - name: Init hugi obench submodule
        run: git -C hugi submodule update --init deps/obench

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Odin compiler info
        working-directory: forseti
        run: odin report

      - name: Run strict static checks
        working-directory: forseti
        run: |
          # -disallow-do omitted because xitdb/lua.odin uses `do`
          odin check forseti -no-entry-point -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti
          odin check lsp -no-entry-point -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_lsp
          odin check actors -no-entry-point -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_actors
          odin check capi -no-entry-point -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_capi
          odin check cmd/forseti -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_lsp,main
          odin check cmd/forseti-lsp -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_lsp,main
          odin check benchmarks -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -collection:hugi=../hugi/hugi -collection:obench=../hugi/deps/obench/obench -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,main
          odin check benchmarks/render -collection:runa=../runa -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:bench_render
          odin check tests -no-entry-point -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_lsp,forseti_tests
          odin check specs -no-entry-point -collection:xitdb=../xitdb/xitdb -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_specs
          odin check specs_actors -no-entry-point -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -vet -vet-tabs -strict-style -warnings-as-errors -vet-packages:forseti,forseti_actors,forseti_actors_specs

      - name: Run leak-checked unit, doc & example tests
        working-directory: forseti
        run: odin test tests -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Run leak-checked 4-layer ATDD specification suite
        working-directory: forseti
        run: odin test specs -collection:xitdb=../xitdb/xitdb -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Run leak-checked Sleipnir actor 4-layer ATDD suite
        working-directory: forseti
        run: odin test specs_actors -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Run leak-checked benchmark renderer tests
        working-directory: forseti
        run: odin test benchmarks/render -collection:runa=../runa -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Verify package documentation generation
        working-directory: forseti
        run: odin doc forseti -collection:xitdb=../xitdb/xitdb > /dev/null

  asan:
    name: AddressSanitizer Tests (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: forseti

      - name: Checkout odin-xitdb
        uses: actions/checkout@v7
        with:
          repository: boxxxie/odin-xitdb
          ref: v2.2.0
          path: xitdb
          submodules: false
          persist-credentials: false

      - name: Checkout sleipnir v1.1.3
        uses: actions/checkout@v7
        with:
          repository: boxxxie/sleipnir
          ref: v1.1.3
          path: sleipnir
          submodules: false
          persist-credentials: false

      - name: Checkout runa
        uses: actions/checkout@v7
        with:
          repository: boxxxie/runa
          ref: main
          path: runa
          submodules: false
          persist-credentials: false

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-10
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Run AddressSanitizer unit, doc & example tests
        working-directory: forseti
        run: odin test tests -sanitize:address -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Run AddressSanitizer Sleipnir actor specs
        working-directory: forseti
        run: odin test specs_actors -sanitize:address -collection:xitdb=../xitdb/xitdb -collection:actor=../sleipnir/actor -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true
